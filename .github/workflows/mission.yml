name: Save mission
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  save:
    # Only owner/collaborators can write files; strangers' issues are ignored.
    if: startsWith(github.event.issue.title, '[Mission]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          BODY: ${{ github.event.issue.body }}
          N: ${{ github.event.issue.number }}
        run: |
          mkdir -p "Mission Info"
          # drop the "@owner" line and the blank line after it, strip CRs
          printf '%s\n' "$BODY" | tr -d '\r' | tail -n +3 > "Mission Info/mission-$N.txt"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add "Mission Info"
          git commit -m "Add mission $N"
          git push
